<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>余量监控 - 大连理工大学选课系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill me-2"></i>大连理工大学选课系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> 主页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auto_select"><i class="bi bi-lightning"></i> 自动抢课</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/monitor"><i class="bi bi-eye"></i> 余量监控</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- 统计卡片 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card text-center border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="text-primary mb-0" id="totalCourses">0</h3>
                        <small class="text-muted">监控课程</small>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="text-success mb-0" id="availableCourses">0</h3>
                        <small class="text-muted">有余量</small>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="text-info mb-0" id="checkCount">0</h3>
                        <small class="text-muted">检查次数</small>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="text-warning mb-0" id="successCount">0</h3>
                        <small class="text-muted">成功选课</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- 搜索课程 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-search text-primary me-2"></i>搜索课程</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">课程名称</label>
                                <input type="text" class="form-control form-control-sm" id="search_input" placeholder="输入课程名称">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">课程代码</label>
                                <input type="text" class="form-control form-control-sm" id="courseCode" placeholder="输入课程代码">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">教学班名称</label>
                                <input type="text" class="form-control form-control-sm" id="className" placeholder="输入教学班名称">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">授课教师</label>
                                <input type="text" class="form-control form-control-sm" id="teacherName" placeholder="输入教师姓名">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-4">
                                <label class="form-label small">校区</label>
                                <select class="form-select form-select-sm" id="campus_filter">
                                    <option value="">全部</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">课程类型</label>
                                <select class="form-select form-select-sm" id="courseTypeSelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">课程性质</label>
                                <select class="form-select form-select-sm" id="coursePropertySelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-4">
                                <label class="form-label small">方案内行政班</label>
                                <select class="form-select form-select-sm" id="adminClassSelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">必修/选修</label>
                                <select class="form-select form-select-sm" id="compulsorySelect">
                                    <option value="">全部</option>
                                    <option value="COMPULSORY">必修</option>
                                    <option value="ELECTIVE">选修</option>
                                </select>
                            </div>
                            <div class="col-4 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="onlyAvailable">
                                    <label class="form-check-label small" for="onlyAvailable">仅显示有余量</label>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100" onclick="searchCourses()">
                            <i class="bi bi-search"></i> 搜索课程
                        </button>
                        <div id="search_results" class="mt-3" style="max-height: 350px; overflow-y: auto;">
                            <div class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1"></i>
                                <p>请搜索课程</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 监控设置 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-gear text-primary me-2"></i>监控设置</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn btn-success" onclick="startMonitoring()" id="startBtn">
                                <i class="bi bi-play-fill"></i> 开始监控
                            </button>
                            <button class="btn btn-warning" onclick="stopMonitoring()" id="stopBtn" disabled>
                                <i class="bi bi-pause-fill"></i> 停止
                            </button>
                            <button class="btn btn-outline-danger" onclick="clearMonitorList()">
                                <i class="bi bi-trash"></i> 清空
                            </button>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">检查间隔 (秒)</label>
                                <input type="number" class="form-control" id="interval" value="3" min="1" max="30">
                            </div>
                            <div class="col-6 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="autoSelect" checked>
                                    <label class="form-check-label" for="autoSelect">发现余量自动选课</label>
                                </div>
                            </div>
                        </div>
                        
                        <div id="monitor_list" style="max-height: 300px; overflow-y: auto;">
                            <div class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1"></i>
                                <p>暂无监控课程</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 监控日志 -->
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-terminal text-primary me-2"></i>监控日志</h5>
                <button class="btn btn-outline-secondary btn-sm" onclick="clearLogs()">
                    <i class="bi bi-trash"></i> 清空日志
                </button>
            </div>
            <div class="card-body p-0">
                <pre id="log_display" class="bg-dark text-light p-3 mb-0" style="max-height: 250px; overflow-y: auto; font-size: 13px;"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let monitorCourses = [];
        let isMonitoring = false;
        let monitorInterval = null;
        let logHistory = [];
        let checkCount = 0;
        let successCount = 0;

        document.addEventListener('DOMContentLoaded', function() {
            loadCampuses();
            loadCourseTypes();
            loadCourseProperties();
            loadAdminClasses();
            updateMonitorList();
            initLogDisplay();
        });

        async function loadCampuses() {
            try {
                const response = await fetch('/get_campuses');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('campus_filter');
                    data.campuses.forEach(campus => {
                        const option = document.createElement('option');
                        option.value = campus;
                        option.textContent = campus;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载校区失败:', error);
            }
        }

        async function loadCourseTypes() {
            try {
                const response = await fetch('/get_course_types');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('courseTypeSelect');
                    data.types.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t;
                        option.textContent = t;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载课程类型失败:', error);
            }
        }

        async function loadCourseProperties() {
            try {
                const response = await fetch('/get_course_properties');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('coursePropertySelect');
                    data.properties.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p;
                        option.textContent = p;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载课程性质失败:', error);
            }
        }

        async function loadAdminClasses() {
            try {
                const response = await fetch('/get_admin_classes');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('adminClassSelect');
                    data.classes.forEach(c => {
                        const option = document.createElement('option');
                        option.value = c;
                        option.textContent = c;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载行政班失败:', error);
            }
        }

        async function searchCourses() {
            const courseName = document.getElementById('search_input').value.trim();
            const campus = document.getElementById('campus_filter').value;
            const courseCode = document.getElementById('courseCode').value.trim();
            const className = document.getElementById('className').value.trim();
            const teacherName = document.getElementById('teacherName').value.trim();
            const courseType = document.getElementById('courseTypeSelect').value;
            const courseProperty = document.getElementById('coursePropertySelect').value;
            const adminClass = document.getElementById('adminClassSelect').value;
            const compulsory = document.getElementById('compulsorySelect').value;
            const onlyAvailable = document.getElementById('onlyAvailable').checked;

            if (!courseName && !courseCode && !className && !teacherName && !campus && !courseType && !courseProperty && !adminClass && !compulsory) {
                alert('请至少输入一个搜索条件');
                return;
            }
            
            try {
                const response = await fetch('/search_course', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        course_name: courseName, campus: campus,
                        course_code: courseCode, class_name: className,
                        teacher: teacherName, course_type: courseType,
                        course_property: courseProperty, admin_class: adminClass,
                        compulsory: compulsory, only_available: onlyAvailable
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showCourses(data.courses);
                } else {
                    alert('搜索失败: ' + data.message);
                }
            } catch (error) {
                alert('搜索出错: ' + error.message);
            }
        }

        function showCourses(courses) {
            const container = document.getElementById('search_results');

            if (courses.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>未找到课程</p></div>';
                return;
            }

            let html = '<div class="list-group list-group-flush">';
            courses.forEach(course => {
                const availableSpots = course.capacity - parseInt(course.selected);
                const statusClass = availableSpots > 0 ? 'text-success' : 'text-danger';
                const statusText = availableSpots > 0 ? `余量: ${availableSpots}` : '已满';

                // 检查是否有多个选课组
                const scheduleGroups = course.scheduleGroups || [];
                const hasMultipleGroups = scheduleGroups.length > 1;

                // 生成选课组选择器HTML
                let groupSelectorHtml = '';
                if (hasMultipleGroups) {
                    groupSelectorHtml = `
                        <div class="mt-2">
                            <label class="form-label small"><i class="bi bi-calendar-check"></i> 选择选课组:</label>
                            <select class="form-select form-select-sm" id="scheduleGroup_${course.id}">
                                ${scheduleGroups.map((group, idx) => `
                                    <option value="${group.id}" ${group.default ? 'selected' : ''}>
                                        组${group.no + 1}: ${group.timeText || '时间待定'} (容量:${group.limitCount})
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                    `;
                } else if (scheduleGroups.length === 1) {
                    // 只有一个选课组，显示时间并创建隐藏的select存储ID
                    const group = scheduleGroups[0];
                    groupSelectorHtml = `
                        <div class="mt-1">
                            <small class="text-muted"><i class="bi bi-calendar-check"></i> 时间: ${group.timeText || '时间待定'}</small>
                            <select class="d-none" id="scheduleGroup_${course.id}">
                                <option value="${group.id}" selected></option>
                            </select>
                        </div>
                    `;
                }

                html += `
                    <div class="list-group-item px-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${course.name} <small class="text-muted">${course.code}</small></h6>
                                <div class="text-secondary small text-truncate" style="max-width: 280px;" title="${course.className || ''}"><i class="bi bi-people"></i> ${course.className || ''}</div>
                                <small class="text-muted">${course.teachers} | ${course.campus} | ${course.selected}/${course.capacity}</small>
                                ${course.courseType ? `<br><small class="text-muted"><i class="bi bi-tag"></i> ${course.courseType} | ${course.courseProperty || ''}</small>` : ''}
                                ${groupSelectorHtml}
                            </div>
                            <div class="text-end">
                                <span class="badge ${availableSpots > 0 ? 'bg-success' : 'bg-danger'} mb-1">${statusText}</span><br>
                                <button class="btn btn-primary btn-sm" onclick="addToMonitor(${course.id}, '${course.name}', '${course.code}', '${course.teachers}', '${course.campus}', ${course.capacity}, ${hasMultipleGroups})">
                                    <i class="bi bi-plus"></i> 监控
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function addToMonitor(courseId, courseName, courseCode, teachers, campus, capacity, hasMultipleGroups = false) {
            if (monitorCourses.find(course => course.id === courseId)) {
                alert('该课程已在监控列表中');
                return;
            }

            let scheduleGroupId = null;
            // 从选课组选择器获取选中的ID（无论单个还是多个选课组）
            const selectElement = document.getElementById(`scheduleGroup_${courseId}`);
            if (selectElement) {
                scheduleGroupId = parseInt(selectElement.value);
            }

            monitorCourses.push({
                id: courseId, name: courseName, code: courseCode,
                teachers: teachers, campus: campus, capacity: capacity,
                selected: 0, available: 0, lastCheck: null,
                schedule_group_id: scheduleGroupId
            });

            updateMonitorList();
            updateStats();
        }

        function updateMonitorList() {
            const container = document.getElementById('monitor_list');

            if (monitorCourses.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>暂无监控课程</p></div>';
                return;
            }

            let html = '<div class="list-group list-group-flush">';
            monitorCourses.forEach((course, index) => {
                const hasAvailable = course.available > 0;
                const statusText = course.lastCheck ? `${course.selected}/${course.capacity} (余量: ${course.available})` : '未检查';
                const scheduleGroupText = course.schedule_group_id ? `<br><small class="text-info">选课组ID: ${course.schedule_group_id}</small>` : '';

                html += `
                    <div class="list-group-item px-0 ${hasAvailable ? 'list-group-item-success' : ''}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${course.name}</strong>
                                ${hasAvailable ? '<span class="badge bg-success ms-2">有余量</span>' : ''}
                                <br><small class="text-muted">ID: ${course.id} | ${course.teachers}</small>
                                ${scheduleGroupText}
                                <br><small class="${hasAvailable ? 'text-success' : 'text-muted'}">${statusText}</small>
                            </div>
                            <button class="btn btn-outline-danger btn-sm" onclick="removeFromMonitor(${index})" ${isMonitoring ? 'disabled' : ''}>
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function removeFromMonitor(index) {
            if (isMonitoring) return;
            monitorCourses.splice(index, 1);
            updateMonitorList();
            updateStats();
        }

        function clearMonitorList() {
            if (isMonitoring) return;
            monitorCourses = [];
            updateMonitorList();
            updateStats();
        }

        function startMonitoring() {
            if (monitorCourses.length === 0) {
                alert('请先添加要监控的课程');
                return;
            }
            
            isMonitoring = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            addLog('🚀 开始监控课程余量...');
            checkCourses();
        }

        function stopMonitoring() {
            isMonitoring = false;
            if (monitorInterval) {
                clearTimeout(monitorInterval);
                monitorInterval = null;
            }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            addLog('⏸️ 监控已停止');
        }

        async function checkCourses() {
            if (!isMonitoring) return;
            
            try {
                checkCount++;
                updateStats();
                
                const courseIds = monitorCourses.map(course => course.id);
                const response = await fetch('/check_course_availability', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({course_ids: courseIds})
                });
                
                const data = await response.json();
                if (data.success) {
                    monitorCourses.forEach(course => {
                        course.lastCheck = new Date().toLocaleTimeString();
                        const availableCourse = data.available_courses.find(ac => ac.id === course.id);
                        if (availableCourse) {
                            course.selected = availableCourse.selected;
                            course.available = availableCourse.available;
                        } else {
                            course.available = 0;
                        }
                    });
                    
                    updateMonitorList();
                    updateStats();
                    
                    if (data.available_courses.length > 0) {
                        addLog(`🟢 发现 ${data.available_courses.length} 门课程有余量!`);
                        
                        if (document.getElementById('autoSelect').checked) {
                            for (const course of data.available_courses) {
                                addLog(`🎯 尝试自动选课: ${course.name}`);
                                await attemptAutoSelect(course.id, course.name);
                            }
                        } else {
                            data.available_courses.forEach(course => {
                                addLog(`💡 ${course.name} 有 ${course.available} 个余量`);
                            });
                        }
                    } else {
                        addLog(`🔍 检查完成，暂无余量`);
                    }
                } else {
                    addLog(`❌ 检查失败: ${data.message}`);
                }
                
            } catch (error) {
                addLog(`❌ 检查出错: ${error.message}`);
            }
            
            if (isMonitoring) {
                const interval = parseInt(document.getElementById('interval').value) * 1000;
                monitorInterval = setTimeout(checkCourses, interval);
            }
        }

        async function attemptAutoSelect(courseId, courseName) {
            try {
                // 查找监控课程以获取选课组ID
                const monitorCourse = monitorCourses.find(course => course.id === courseId);
                const requestBody = {class_id: courseId};

                // 如果有选课组ID，添加到请求中
                if (monitorCourse && monitorCourse.schedule_group_id) {
                    requestBody.schedule_group_id = monitorCourse.schedule_group_id;
                }

                const response = await fetch('/select_course', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                if (data.success) {
                    successCount++;
                    updateStats();
                    addLog(`🎉 自动选课成功: ${courseName}`);

                    const index = monitorCourses.findIndex(course => course.id === courseId);
                    if (index !== -1) {
                        monitorCourses.splice(index, 1);
                        updateMonitorList();
                        updateStats();
                    }
                } else {
                    addLog(`❌ 自动选课失败: ${courseName} - ${data.message}`);
                }
            } catch (error) {
                addLog(`❌ 自动选课出错: ${courseName} - ${error.message}`);
            }
        }

        function updateStats() {
            document.getElementById('totalCourses').textContent = monitorCourses.length;
            const availableCount = monitorCourses.filter(course => course.available > 0).length;
            document.getElementById('availableCourses').textContent = availableCount;
            document.getElementById('checkCount').textContent = checkCount;
            document.getElementById('successCount').textContent = successCount;
        }

        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logHistory.push(`[${timestamp}] ${message}`);
            if (logHistory.length > 100) logHistory.shift();
            
            const logDiv = document.getElementById('log_display');
            logDiv.textContent = logHistory.join('\n');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function initLogDisplay() {
            logHistory = ['等待开始监控...'];
            document.getElementById('log_display').textContent = logHistory.join('\n');
        }

        function clearLogs() {
            logHistory = ['日志已清空'];
            document.getElementById('log_display').textContent = logHistory.join('\n');
        }

        document.getElementById('search_input').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchCourses();
        });
    </script>
</body>
</html>
