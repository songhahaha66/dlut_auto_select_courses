<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动抢课 - 大连理工大学选课系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill me-2"></i>大连理工大学选课系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> 主页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/auto_select"><i class="bi bi-lightning"></i> 自动抢课</a></li>
                    <li class="nav-item"><a class="nav-link" href="/monitor"><i class="bi bi-eye"></i> 余量监控</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <!-- 搜索课程 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-search text-primary me-2"></i>搜索课程</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">课程名称</label>
                                <input type="text" class="form-control form-control-sm" id="search_input" placeholder="输入课程名称">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">课程代码</label>
                                <input type="text" class="form-control form-control-sm" id="courseCode" placeholder="输入课程代码">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">教学班名称</label>
                                <input type="text" class="form-control form-control-sm" id="className" placeholder="输入教学班名称">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">授课教师</label>
                                <input type="text" class="form-control form-control-sm" id="teacherName" placeholder="输入教师姓名">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-4">
                                <label class="form-label small">校区</label>
                                <select class="form-select form-select-sm" id="campus_filter">
                                    <option value="">全部</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">课程类型</label>
                                <select class="form-select form-select-sm" id="courseTypeSelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">课程性质</label>
                                <select class="form-select form-select-sm" id="coursePropertySelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-4">
                                <label class="form-label small">方案内行政班</label>
                                <input type="text" class="form-control form-control-sm" id="adminClassSelect" list="adminClassList" placeholder="输入或选择行政班">
                                <datalist id="adminClassList"></datalist>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">必修/选修</label>
                                <select class="form-select form-select-sm" id="compulsorySelect">
                                    <option value="">全部</option>
                                    <option value="COMPULSORY">必修</option>
                                    <option value="ELECTIVE">选修</option>
                                </select>
                            </div>
                            <div class="col-4 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="onlyAvailable">
                                    <label class="form-check-label small" for="onlyAvailable">仅显示有余量</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary flex-grow-1" onclick="searchCourses()"><i class="bi bi-search"></i> 搜索</button>
                            <button class="btn btn-outline-secondary flex-grow-1" onclick="loadSelectedCourses()"><i class="bi bi-bookmark"></i> 已选课程</button>
                        </div>
                        <div id="search_results" class="mt-3" style="max-height: 350px; overflow-y: auto;">
                            <div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>请搜索课程</p></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作队列 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-list-task text-primary me-2"></i>操作队列</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn btn-success" onclick="startQueue()" id="startBtn"><i class="bi bi-play-fill"></i> 开始</button>
                            <button class="btn btn-warning" onclick="stopQueue()" id="stopBtn" disabled><i class="bi bi-pause-fill"></i> 停止</button>
                            <button class="btn btn-outline-danger" onclick="clearOperations()"><i class="bi bi-trash"></i> 清空</button>
                        </div>
                        <div id="countdown" class="alert alert-info py-2 px-3 mb-3 d-none"></div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small">间隔 (秒)</label>
                                <input type="number" class="form-control form-control-sm" id="interval" value="0" min="0" max="10">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">执行模式</label>
                                <select class="form-select form-select-sm" id="concurrencyMode">
                                    <option value="sequential">顺序执行</option>
                                    <option value="parallel">并发执行</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3" id="threadSettings" style="display: none;">
                            <label class="form-label small">并发线程数</label>
                            <input type="number" class="form-control form-control-sm" id="threadCount" value="5" min="1" max="20">
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="enableSchedule" onchange="toggleSchedule()">
                            <label class="form-check-label small" for="enableSchedule">启用定时启动</label>
                        </div>
                        <div class="mb-3" id="scheduleSettings" style="display: none;">
                            <label class="form-label small">预定启动时间</label>
                            <input type="datetime-local" class="form-control form-control-sm" id="scheduleTime">
                            <small class="text-muted">当前: <span id="currentTime"></span></small>
                        </div>
                        <div id="operation_list" style="max-height: 250px; overflow-y: auto;">
                            <div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>暂无操作</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 运行状态 -->
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-terminal text-primary me-2"></i>运行状态</h5>
                <button class="btn btn-outline-secondary btn-sm" onclick="clearHistory()"><i class="bi bi-trash"></i> 清空</button>
            </div>
            <div class="card-body p-0">
                <pre id="status_display" class="bg-dark text-light p-3 mb-0" style="max-height: 250px; overflow-y: auto; font-size: 13px;"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 队列与运行状态均由服务端维护，页面只负责展示，切换页面/刷新不会中断任务
        let taskState = 'idle', operations = [], scheduleAt = null, serverTimeOffset = 0;
        let logSeq = 0, logGeneration = null, logLines = [], lastOperationsSignature = null;

        document.addEventListener('DOMContentLoaded', function() {
            Promise.all([loadCampuses(), loadCourseTypes(), loadCourseProperties(), loadAdminClasses()])
                .then(restoreSearchFilters);
            restoreSearchResults(); updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            document.getElementById('concurrencyMode').addEventListener('change', function() {
                document.getElementById('threadSettings').style.display = this.value === 'parallel' ? 'block' : 'none';
            });
            refreshStatus();
            setInterval(refreshStatus, 1000);
        });

        // ===== 服务端状态同步 =====

        async function refreshStatus() {
            try {
                const response = await fetch(`/api/auto_select/status?since=${logSeq}`);
                const data = await response.json();
                if (data.redirect) { window.location.href = data.redirect; return; }
                if (!data.success) return;
                applyStatus(data);
            } catch (error) { /* 轮询失败时静默重试 */ }
        }

        function applyStatus(data) {
            const previousState = taskState;
            taskState = data.state;
            operations = data.operations;
            scheduleAt = data.schedule_at;
            serverTimeOffset = data.server_time * 1000 - Date.now();

            const signature = JSON.stringify(operations) + '|' + taskState;
            if (signature !== lastOperationsSignature) {
                lastOperationsSignature = signature;
                updateOperationList();
            }

            // 任务运行中时，配置项以服务端为准并锁定
            const running = taskState !== 'idle';
            if (running) {
                document.getElementById('interval').value = data.config.interval;
                document.getElementById('concurrencyMode').value = data.config.mode;
                document.getElementById('threadCount').value = data.config.thread_count;
                document.getElementById('threadSettings').style.display = data.config.mode === 'parallel' ? 'block' : 'none';
            }
            ['interval', 'concurrencyMode', 'threadCount', 'enableSchedule', 'scheduleTime'].forEach(id => {
                document.getElementById(id).disabled = running;
            });
            document.getElementById('startBtn').disabled = running;
            document.getElementById('stopBtn').disabled = !running;

            updateLogs(data.log);
            updateCountdown();

            if (previousState !== 'idle' && taskState === 'idle') {
                document.getElementById('enableSchedule').checked = false;
                document.getElementById('scheduleSettings').style.display = 'none';
            }
        }

        function updateLogs(log) {
            if (logGeneration !== null && log.generation !== logGeneration) {
                logLines = [];
                logSeq = 0;
            }
            logGeneration = log.generation;
            if (log.lines.length) {
                logLines = logLines.concat(log.lines);
                if (logLines.length > 500) logLines = logLines.slice(-500);
            }
            logSeq = log.seq;

            const statusDiv = document.getElementById('status_display');
            const text = logLines.length ? logLines.join('\n') : '等待开始...';
            if (statusDiv.textContent !== text) {
                const atBottom = statusDiv.scrollTop + statusDiv.clientHeight >= statusDiv.scrollHeight - 20;
                statusDiv.textContent = text;
                if (atBottom) statusDiv.scrollTop = statusDiv.scrollHeight;
            }
        }

        function updateCountdown() {
            const el = document.getElementById('countdown');
            if (taskState === 'scheduled' && scheduleAt) {
                const remaining = Math.max(0, scheduleAt * 1000 - (Date.now() + serverTimeOffset));
                const m = Math.floor(remaining / 60000), s = Math.floor((remaining % 60000) / 1000);
                el.textContent = `倒计时: ${m}分${s}秒后启动队列`;
                el.classList.remove('d-none');
            } else {
                el.classList.add('d-none');
            }
        }

        async function postJSON(url, body) {
            const response = await fetch(url, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body || {})
            });
            const data = await response.json();
            if (data.redirect) { window.location.href = data.redirect; return {success: false, message: '未登录'}; }
            return data;
        }

        async function loadCampuses() {
            try {
                const response = await fetch('/get_campuses');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('campus_filter');
                    data.campuses.forEach(campus => {
                        const option = document.createElement('option');
                        option.value = campus; option.textContent = campus;
                        select.appendChild(option);
                    });
                }
            } catch (error) { console.error('加载校区失败:', error); }
        }

        async function loadCourseTypes() {
            try {
                const response = await fetch('/get_course_types');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('courseTypeSelect');
                    data.types.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t; option.textContent = t;
                        select.appendChild(option);
                    });
                }
            } catch (error) { console.error('加载课程类型失败:', error); }
        }

        async function loadCourseProperties() {
            try {
                const response = await fetch('/get_course_properties');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('coursePropertySelect');
                    data.properties.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p; option.textContent = p;
                        select.appendChild(option);
                    });
                }
            } catch (error) { console.error('加载课程性质失败:', error); }
        }

        async function loadAdminClasses() {
            try {
                const response = await fetch('/get_admin_classes');
                const data = await response.json();
                if (data.success) {
                    const datalist = document.getElementById('adminClassList');
                    data.classes.forEach(c => {
                        const option = document.createElement('option');
                        option.value = c;
                        datalist.appendChild(option);
                    });
                }
            } catch (error) { console.error('加载行政班失败:', error); }
        }

        async function searchCourses() {
            const courseName = document.getElementById('search_input').value.trim();
            const campus = document.getElementById('campus_filter').value;
            const courseCode = document.getElementById('courseCode').value.trim();
            const className = document.getElementById('className').value.trim();
            const teacherName = document.getElementById('teacherName').value.trim();
            const courseType = document.getElementById('courseTypeSelect').value;
            const courseProperty = document.getElementById('coursePropertySelect').value;
            const adminClass = document.getElementById('adminClassSelect').value;
            const compulsory = document.getElementById('compulsorySelect').value;
            const onlyAvailable = document.getElementById('onlyAvailable').checked;

            if (!courseName && !courseCode && !className && !teacherName && !campus && !courseType && !courseProperty && !adminClass && !compulsory && !onlyAvailable) {
                alert('请至少输入一个搜索条件'); return;
            }
            try {
                const response = await fetch('/search_course', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        course_name: courseName, campus: campus,
                        course_code: courseCode, class_name: className,
                        teacher: teacherName, course_type: courseType,
                        course_property: courseProperty, admin_class: adminClass,
                        compulsory: compulsory, only_available: onlyAvailable
                    })
                });
                const data = await response.json();
                if (data.success) showCourses(data.courses, 'select');
                else alert('搜索失败: ' + data.message);
            } catch (error) { alert('搜索出错: ' + error.message); }
        }

        async function loadSelectedCourses() {
            try {
                const response = await fetch('/selected_courses');
                const data = await response.json();
                if (data.success) showCourses(data.courses, 'drop');
                else alert('加载失败: ' + data.message);
            } catch (error) { alert('加载出错: ' + error.message); }
        }

        function showCourses(courses, defaultType) {
            const container = document.getElementById('search_results');
            if (courses.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>未找到课程</p></div>';
                return;
            }
            let html = '<div class="list-group list-group-flush">';
            courses.forEach(course => {
                // 检查是否有多个选课组
                const scheduleGroups = course.scheduleGroups || [];
                const hasMultipleGroups = scheduleGroups.length > 1;

                // 生成选课组选择器HTML
                let groupSelectorHtml = '';
                if (hasMultipleGroups) {
                    groupSelectorHtml = `
                        <div class="mt-2">
                            <label class="form-label small"><i class="bi bi-calendar-check"></i> 选择选课组:</label>
                            <select class="form-select form-select-sm" id="scheduleGroup_${course.id}">
                                ${scheduleGroups.map((group, idx) => `
                                    <option value="${group.id}" ${group.default ? 'selected' : ''}>
                                        组${group.no + 1}: ${group.timeText || '时间待定'} (容量:${group.limitCount})
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                    `;
                } else if (scheduleGroups.length === 1) {
                    // 只有一个选课组，显示时间并创建隐藏的select存储ID
                    const group = scheduleGroups[0];
                    groupSelectorHtml = `
                        <div class="mt-1">
                            <small class="text-muted"><i class="bi bi-calendar-check"></i> 时间: ${group.timeText || '时间待定'}</small>
                            <select class="d-none" id="scheduleGroup_${course.id}">
                                <option value="${group.id}" selected></option>
                            </select>
                        </div>
                    `;
                }

                html += `<div class="list-group-item px-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">${course.name} <small class="text-muted">${course.code}</small></h6>
                            <div class="text-secondary small text-truncate" style="max-width: 280px;" title="${course.className || ''}"><i class="bi bi-people"></i> ${course.className || ''}</div>
                            <small class="text-muted">${course.teachers} | ${course.campus} | ${course.selected}/${course.capacity}</small>
                            ${course.available !== undefined ? `<span class="badge ${course.available > 0 ? 'bg-success' : 'bg-danger'} ms-1">余量:${course.available}</span>` : ''}
                            ${course.courseType ? `<br><small class="text-muted"><i class="bi bi-tag"></i> ${course.courseType} | ${course.courseProperty || ''}</small>` : ''}
                            ${groupSelectorHtml}
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select form-select-sm" id="type_${course.id}" style="width:80px;">
                                <option value="select" ${defaultType === 'select' ? 'selected' : ''}>选课</option>
                                <option value="drop" ${defaultType === 'drop' ? 'selected' : ''}>退课</option>
                            </select>
                            <button class="btn btn-primary btn-sm" onclick="addOperation(${course.id}, '${course.name}', ${hasMultipleGroups})"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
            saveSearchState();
        }

        // ===== 搜索条件与结果本地缓存，切换页面回来不丢失 =====

        const SEARCH_FIELDS = ['search_input', 'courseCode', 'className', 'teacherName',
                               'campus_filter', 'courseTypeSelect', 'coursePropertySelect',
                               'adminClassSelect', 'compulsorySelect'];

        function saveSearchState() {
            const filters = {};
            SEARCH_FIELDS.forEach(id => { filters[id] = document.getElementById(id).value; });
            filters.onlyAvailable = document.getElementById('onlyAvailable').checked;
            try {
                sessionStorage.setItem('autoSelect.search', JSON.stringify({
                    filters: filters,
                    html: document.getElementById('search_results').innerHTML
                }));
            } catch (error) { /* 存储不可用时忽略 */ }
        }

        function readSearchState() {
            try { return JSON.parse(sessionStorage.getItem('autoSelect.search')); } catch (error) { return null; }
        }

        function restoreSearchResults() {
            const saved = readSearchState();
            if (saved && saved.html) document.getElementById('search_results').innerHTML = saved.html;
        }

        // 下拉框选项是异步加载的，选项就绪后再恢复选中值
        function restoreSearchFilters() {
            const saved = readSearchState();
            if (!saved) return;
            SEARCH_FIELDS.forEach(id => {
                if (saved.filters[id] !== undefined) document.getElementById(id).value = saved.filters[id];
            });
            document.getElementById('onlyAvailable').checked = !!saved.filters.onlyAvailable;
        }

        async function addOperation(courseId, courseName, hasMultipleGroups = false) {
            const type = document.getElementById(`type_${courseId}`).value;

            let scheduleGroupId = null;
            if (type === 'select') {
                // 从选课组选择器获取选中的ID（无论单个还是多个选课组）
                const selectElement = document.getElementById(`scheduleGroup_${courseId}`);
                if (selectElement) {
                    scheduleGroupId = parseInt(selectElement.value);
                }
            }

            const data = await postJSON('/api/auto_select/operations/add', {
                course_id: courseId, type: type, course_name: courseName, schedule_group_id: scheduleGroupId
            });
            if (!data.success) { alert(data.message); return; }
            refreshStatus();
        }

        function updateOperationList() {
            const container = document.getElementById('operation_list');
            if (operations.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1"></i><p>暂无操作</p></div>';
                return;
            }
            let html = '<div class="list-group list-group-flush">';
            operations.forEach((op, index) => {
                const isSelect = op.type === 'select';
                const scheduleGroupText = op.schedule_group_id ? `<br><small class="text-info">选课组ID: ${op.schedule_group_id}</small>` : '';
                html += `<div class="list-group-item px-0 ${isSelect ? 'list-group-item-primary' : 'list-group-item-danger'}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge ${isSelect ? 'bg-primary' : 'bg-danger'}">${isSelect ? '选课' : '退课'}</span>
                            <strong class="ms-2">${op.course_name}</strong>
                            <br><small class="text-muted">ID: ${op.course_id}</small>${scheduleGroupText}
                        </div>
                        <button type="button" class="btn btn-outline-danger btn-sm" data-index="${index}"><i class="bi bi-x"></i></button>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
            // 绑定删除按钮事件
            const running = taskState !== 'idle';
            container.querySelectorAll('button[data-index]').forEach(btn => {
                btn.addEventListener('click', async function() {
                    if (taskState !== 'idle') return;
                    const idx = parseInt(this.getAttribute('data-index'));
                    const data = await postJSON('/api/auto_select/operations/remove', {index: idx});
                    if (!data.success) { alert(data.message); return; }
                    refreshStatus();
                });
                btn.disabled = running;
            });
        }

        async function clearOperations() {
            if (taskState !== 'idle') return;
            const data = await postJSON('/api/auto_select/operations/clear');
            if (!data.success) { alert(data.message); return; }
            refreshStatus();
        }

        async function startQueue() {
            if (operations.length === 0) { alert('请先添加操作'); return; }

            let scheduleAtSeconds = null;
            if (document.getElementById('enableSchedule').checked) {
                const scheduleTime = document.getElementById('scheduleTime').value;
                if (!scheduleTime) { alert('请设置预定启动时间'); return; }
                const scheduledDate = new Date(scheduleTime);
                if (scheduledDate <= new Date()) { alert('预定时间必须大于当前时间'); return; }
                scheduleAtSeconds = scheduledDate.getTime() / 1000;
            }

            const data = await postJSON('/api/auto_select/start', {
                interval: parseInt(document.getElementById('interval').value) || 0,
                mode: document.getElementById('concurrencyMode').value,
                thread_count: parseInt(document.getElementById('threadCount').value) || 1,
                schedule_at: scheduleAtSeconds
            });
            if (!data.success) { alert(data.message); return; }
            refreshStatus();
        }

        async function stopQueue() {
            const data = await postJSON('/api/auto_select/stop');
            if (!data.success && data.message) alert(data.message);
            refreshStatus();
        }

        async function clearHistory() {
            await postJSON('/api/auto_select/logs/clear');
            logLines = [];
            logSeq = 0;
            document.getElementById('status_display').textContent = '等待开始...';
            refreshStatus();
        }

        function toggleSchedule() {
            const enabled = document.getElementById('enableSchedule').checked;
            document.getElementById('scheduleSettings').style.display = enabled ? 'block' : 'none';
            if (enabled) {
                // 用本地时间填充 datetime-local（不能用 toISOString，那是 UTC）
                const now = new Date(Date.now() + 60000);
                const pad = n => String(n).padStart(2, '0');
                document.getElementById('scheduleTime').value =
                    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
            }
        }

        function updateCurrentTime() {
            const el = document.getElementById('currentTime');
            if (el) el.textContent = new Date().toLocaleString('zh-CN');
        }

        document.getElementById('search_input').addEventListener('keypress', e => { if (e.key === 'Enter') searchCourses(); });
    </script>
</body>
</html>
